name: Build and publish Docker image

on:
  push:
    branches: "master"
    tags:
      - 'v*'
  pull_request:
    branches: "master"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push (latest)
        if: startsWith(github.ref, 'refs/heads/')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: | 
            ghcr.io/${{ github.repository_owner }}/instaswarm:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/instaswarm:latest
          
      - name: Build and push (release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/instaswarm:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/instaswarm:latest
